name: Homologar coleta COJUR no Safira

on:
  push:
    branches: [codex/keila-safira-nuvem]

permissions:
  contents: read

concurrency:
  group: keila-safira-cojur-homologacao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/agente-automatico/cojur-safira-homologacao.test.mjs

  consultar:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: keila-safira-homologacao
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar acesso ao portal e autenticação da integração
        run: node scripts/agente-automatico/cojur-safira-homologacao.mjs --probe
      - name: Confirmar configuração do piloto
        env:
          LELLO_SAFIRA_USUARIO: ${{ secrets.LELLO_SAFIRA_USUARIO }}
          LELLO_SAFIRA_SENHA: ${{ secrets.LELLO_SAFIRA_SENHA }}
        run: |
          if [ -z "$LELLO_SAFIRA_USUARIO" ] || [ -z "$LELLO_SAFIRA_SENHA" ]; then
            echo "::error::Credencial da Lello ainda ausente no ambiente de homologação."
            exit 1
          fi
      - name: Preparar navegador
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Consultar a Lello e confirmar o retorno no GKLI
        env:
          GKLI_GRAPH_HOMOLOGACAO_CASE_ID: '0b8cc43a-0969-44dc-9e47-2f4951cfa8cd'
          GKLI_GRAPH_HOMOLOGACAO_LOTE: '434945ee-14ce-4bff-87a9-368a2a6a1ef9,c3650020-4195-4a23-8b04-656b2db48e82,411d2008-cd16-49dc-86eb-11f346e4b71d'
          LELLO_SAFIRA_USUARIO: ${{ secrets.LELLO_SAFIRA_USUARIO }}
          LELLO_SAFIRA_SENHA: ${{ secrets.LELLO_SAFIRA_SENHA }}
        run: node scripts/agente-automatico/cojur-safira-homologacao.mjs
