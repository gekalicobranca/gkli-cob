name: Backup diário Supabase

on:
  schedule:
    # 00:17 em Brasília (UTC-3).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    environment: Production
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: vjcmotflmcczoepflhwc
      SUPABASE_STORAGE_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_ENDPOINT }}
      SUPABASE_STORAGE_REGION: ${{ secrets.SUPABASE_STORAGE_REGION }}
      SUPABASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_ACCESS_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_RCLONE_CONFIG_BASE64: ${{ secrets.BACKUP_RCLONE_CONFIG_BASE64 }}
      BACKUP_RCLONE_REMOTE: ${{ vars.BACKUP_RCLONE_REMOTE }}
      BACKUP_RCLONE_PATH: ${{ vars.BACKUP_RCLONE_PATH }}
    steps:
      - name: Validar configuração
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_DB_URL SUPABASE_STORAGE_ENDPOINT SUPABASE_STORAGE_REGION SUPABASE_STORAGE_ACCESS_KEY_ID SUPABASE_STORAGE_SECRET_ACCESS_KEY BACKUP_ENCRYPTION_PASSPHRASE BACKUP_RCLONE_CONFIG_BASE64 BACKUP_RCLONE_REMOTE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Configuração obrigatória ausente: $name"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas de backup
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          if ! command -v aws >/dev/null; then
            sudo apt-get install -y awscli
          fi
          npm ci
      - name: Criar, criptografar e verificar cópia no Google Drive
        shell: bash
        run: bash scripts/backup/create-backup.sh
